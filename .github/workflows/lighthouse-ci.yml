name: Lighthouse CI Performance & Budgets

on:
  pull_request:
    paths:
      - "apps/tenant-web/**"
      - "apps/platform-web/**"
      - "packages/contracts/**"
      - "packages/ui/**"
      - "perf/**"
      - "lighthouserc.cjs"
      - "lighthouserc.desktop.cjs"
  workflow_dispatch:

concurrency:
  group: lighthouse-ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  lighthouse-ci:
    name: Lighthouse CI (Mobile + Desktop)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: ./.github/actions/setup-mms
        with:
          install: "true"
          build-shared: "true"

      - name: Build Frontend for Production
        id: build-frontend
        run: pnpm --filter mms-tenant-web build

      - name: Run Lighthouse CI (Mobile - 3 runs)
        id: lhci-mobile
        run: |
          set +e
          npx --yes @lhci/cli@0.14.0 autorun --config=./lighthouserc.cjs
          exit_code=$?
          set -e
          # Preserve LHRs for the PR comment regardless of pass/fail.
          if [ -d .lighthouseci ]; then mv .lighthouseci .lighthouseci-mobile; fi
          exit $exit_code

      - name: Run Lighthouse CI (Desktop - 3 runs)
        id: lhci-desktop
        # Run independently of the mobile leg so a mobile budget failure can't
        # hide a simultaneous desktop regression. Still gated on a successful build.
        if: ${{ always() && steps.build-frontend.outcome == 'success' }}
        run: |
          set +e
          npx --yes @lhci/cli@0.14.0 autorun --config=./lighthouserc.desktop.cjs
          exit_code=$?
          set -e
          # Preserve LHRs for the PR comment regardless of pass/fail.
          if [ -d .lighthouseci ]; then mv .lighthouseci .lighthouseci-desktop; fi
          exit $exit_code

      - name: Format Lighthouse PR Comment
        if: always() && github.event_name == 'pull_request'
        id: comment
        run: |
          node scripts/perf/format-lhci-comment.cjs

      - name: Post PR Comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('lhci-comment.md')) {
              const body = fs.readFileSync('lhci-comment.md', 'utf8');
              // Paginate: the bot comment may sit beyond the default first page.
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              });
              const botComment = comments.find(c => c.body.includes('Lighthouse CI Performance Summary'));
              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body,
                });
              }
            }
