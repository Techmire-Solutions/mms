name: Lighthouse CI Performance & Budgets

on:
  pull_request:
    paths:
      - "apps/frontend/**"
      - "packages/shared/**"
      - "packages/ui/**"
      - "perf/**"
      - "lighthouserc.cjs"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  lighthouse-ci:
    name: Lighthouse CI (Mobile & Desktop)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: ./.github/actions/setup-mms
        with:
          install: "true"
          build-shared: "true"

      - name: Build Frontend for Production
        run: pnpm --filter mms-frontend build
        env:
          ANALYZE: "1"

      - name: Run Lighthouse CI (Mobile & Desktop - 3 runs each)
        id: lhci
        run: |
          npx --yes @lhci/cli@0.14.x autorun --config=./lighthouserc.cjs
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Format Lighthouse PR Comment
        if: always() && github.event_name == 'pull_request'
        id: comment
        run: |
          node -e '
            const fs = require("fs");
            const path = "./.lighthouseci/manifest.json";
            if (!fs.existsSync(path)) {
              console.log("No LHCI manifest found");
              process.exit(0);
            }
            const runs = JSON.parse(fs.readFileSync(path, "utf8"));
            let md = "### ⚡ Lighthouse CI Performance Summary (3 Runs)\n\n";
            md += "| Run | URL | Performance | Accessibility | Best Practices | SEO | LCP | TBT |\n";
            md += "|:---:|---|:---:|:---:|:---:|:---:|:---:|:---:|\n";
            runs.forEach((r, idx) => {
              const s = r.summary;
              const p = Math.round(s.performance * 100);
              const a = Math.round(s.accessibility * 100);
              const b = Math.round(s["best-practices"] * 100);
              const seo = Math.round(s.seo * 100);
              md += `| #${idx + 1} | \`${r.url}\` | **${p}/100** | ${a}/100 | ${b}/100 | ${seo}/100 | - | - |\n`;
            });
            md += "\n> **Budgets:** Performance ≥ 70 | LCP ≤ 4.0s | TBT ≤ 300ms | Initial JS ≤ 200 KiB gzip\n";
            fs.writeFileSync("lhci-comment.md", md);
          '

      - name: Post PR Comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('lhci-comment.md')) {
              const body = fs.readFileSync('lhci-comment.md', 'utf8');
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });
              const botComment = comments.find(c => c.body.includes('Lighthouse CI Performance Summary'));
              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body,
                });
              }
            }
