name: Renew TLS Certificate

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run only — show cert status, no changes"
        type: boolean
        default: false
      tenant_subdomain:
        description: "Tenant subdomain prefix for wildcard verification probe"
        required: false
        default: "dq"
        type: string

permissions:
  contents: read

concurrency:
  group: mms-production-tls-renew
  cancel-in-progress: false

# Required GitHub Secrets (Settings → Secrets → Actions):
#   SERVER_IP, SERVER_USER, SSH_PRIVATE_KEY, MMS_APP_DOMAIN
#   NAMECOM_USERNAME   — your Name.com account username
#   NAMECOM_API_TOKEN  — Name.com API token (account → API tokens)
#
# Name.com API token: https://www.name.com/account/settings/api

jobs:
  issue-wildcard-cert:
    name: Issue wildcard cert via acme.sh + Name.com DNS-01
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 25

    steps:
      - name: Validate configuration & secrets
        env:
          MMS_APP_DOMAIN: ${{ secrets.MMS_APP_DOMAIN }}
          DRY_RUN: ${{ inputs.dry_run }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          NAMECOM_USERNAME: ${{ secrets.NAMECOM_USERNAME }}
          NAMECOM_API_TOKEN: ${{ secrets.NAMECOM_API_TOKEN }}
        run: |
          set -euo pipefail
          missing=""
          [ -z "${SERVER_IP}" ] && missing="${missing} SERVER_IP"
          [ -z "${SERVER_USER}" ] && missing="${missing} SERVER_USER"
          [ -z "${SSH_PRIVATE_KEY}" ] && missing="${missing} SSH_PRIVATE_KEY"
          [ -z "${MMS_APP_DOMAIN}" ] && missing="${missing} MMS_APP_DOMAIN"
          if [ "${DRY_RUN}" != "true" ]; then
            [ -z "${NAMECOM_USERNAME}" ] && missing="${missing} NAMECOM_USERNAME"
            [ -z "${NAMECOM_API_TOKEN}" ] && missing="${missing} NAMECOM_API_TOKEN"
          fi
          if [ -n "${missing}" ]; then
            echo "ERROR: Missing required GitHub Actions secrets:${missing}"
            echo "Add them under Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "Configuration validated for domain: ${MMS_APP_DOMAIN} (dry_run: ${DRY_RUN})"

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure SSH
        uses: ./.github/actions/ssh-setup
        with:
          private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          host: ${{ secrets.SERVER_IP }}

      - name: Issue *.MMS_APP_DOMAIN wildcard cert via SSH
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          MMS_APP_DOMAIN: ${{ secrets.MMS_APP_DOMAIN }}
          NAMECOM_USERNAME: ${{ secrets.NAMECOM_USERNAME }}
          NAMECOM_API_TOKEN: ${{ secrets.NAMECOM_API_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          TENANT_SUBDOMAIN: ${{ inputs.tenant_subdomain || 'dq' }}
        run: |
          bash scripts/ci/ssh-exec.sh scripts/ci/remote/renew-tls.sh \
            MMS_APP_DOMAIN NAMECOM_USERNAME NAMECOM_API_TOKEN DRY_RUN TENANT_SUBDOMAIN

      - name: Probe certificate expiry from runner
        if: success()
        env:
          MMS_APP_DOMAIN: ${{ secrets.MMS_APP_DOMAIN }}
        run: |
          EXPIRY=$(echo | openssl s_client -servername "${MMS_APP_DOMAIN}" -connect "${MMS_APP_DOMAIN}:443" 2>/dev/null | openssl x509 -noout -dates 2>/dev/null | grep notAfter | cut -d= -f2 || echo "Unknown")
          echo "CERT_EXPIRY=${EXPIRY}" >> "$GITHUB_ENV"

      - name: Publish Certificate Summary
        if: always()
        env:
          MMS_APP_DOMAIN: ${{ secrets.MMS_APP_DOMAIN }}
          TENANT_SUBDOMAIN: ${{ inputs.tenant_subdomain || 'dq' }}
          DRY_RUN: ${{ inputs.dry_run }}
          RESULT: ${{ job.status == 'success' && '✅ Completed & Verified' || '❌ Failed' }}
        run: |
          cat << EOF >> "$GITHUB_STEP_SUMMARY"
          ### 🔒 TLS Certificate Renewal Summary

          | Parameter | Value |
          |---|---|
          | **Domain** | [${MMS_APP_DOMAIN}](https://${MMS_APP_DOMAIN}) & \`*.${MMS_APP_DOMAIN}\` |
          | **Tenant Probe Host** | \`${TENANT_SUBDOMAIN}.${MMS_APP_DOMAIN}\` |
          | **Certificate Expiration** | \`${CERT_EXPIRY:-N/A}\` |
          | **Dry Run Mode** | \`${DRY_RUN}\` |
          | **Status** | ${RESULT} |
          EOF

      - name: Cleanup SSH Credentials
        if: always()
        run: |
          shred -u ~/.ssh/deploy_key 2>/dev/null || rm -f ~/.ssh/deploy_key
