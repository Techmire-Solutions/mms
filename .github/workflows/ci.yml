name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    name: Detect File Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      backend_db: ${{ steps.filter.outputs.backend_db }}
      frontend: ${{ steps.filter.outputs.frontend }}
      backend_unit: ${{ steps.filter.outputs.backend_unit }}
      e2e: ${{ steps.filter.outputs.e2e }}
      # `full` on every non-PR run (pushes to main feed deploy) and on PRs that
      # touch shared code, dependencies, test/build config or CI; otherwise
      # `changed`: unit tests run only for files related to the PR's diff.
      test_scope: ${{ steps.scope.outputs.test_scope }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Paths Filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            backend_db:
              - 'apps/backend/src/db/**'
              - 'apps/backend/drizzle.config.ts'
              - 'apps/backend/src/**/repository/**'
              - 'apps/backend/src/**/ledgerPosting/**'
              - 'apps/backend/src/accounting/**'
              - 'apps/backend/vitest.db.config.ts'
              - 'packages/shared/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/**'
            frontend:
              - 'apps/frontend/**'
              - 'packages/shared/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/**'
            backend_unit:
              - 'apps/backend/**'
              - 'packages/shared/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/**'
            e2e:
              - 'e2e/**'
              - 'apps/**'
              - 'packages/shared/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/**'
            full_tests:
              - 'packages/shared/**'
              - '**/package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.nvmrc'
              - 'turbo.json'
              - '**/tsconfig*.json'
              - '**/vitest*.config.*'
              - 'apps/frontend/src/test/**'
              - '.github/**'

      - name: Decide test scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          FULL_TESTS: ${{ steps.filter.outputs.full_tests }}
        run: |
          if [ "${EVENT_NAME}" = "pull_request" ] && [ "${FULL_TESTS}" != "true" ]; then
            scope=changed
          else
            scope=full
          fi
          echo "test_scope=${scope}" >> "$GITHUB_OUTPUT"
          echo "Unit test scope: ${scope}"

  # Blocks PRs that introduce a dependency with a high/critical advisory
  # (mms-dependencies §4). Diff-based, so it complements the full pnpm audit.
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  # actionlint (syntax + shellcheck of run: blocks) and zizmor (Actions
  # security: injection, credential persistence, dangerous triggers, pinning).
  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        run: |
          docker run --rm -v "$PWD:/repo" --workdir /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color # v1.7.7

      - name: zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: "1.30.1"
          advanced-security: false
          min-severity: medium

  # Lint & Typecheck used to be one serial ~4 min job (setup, typecheck, lint,
  # build, gitleaks, ratchets) and the slowest path through CI. It is split
  # into three parallel jobs; ci-gate requires all of them.
  typecheck-lint:
    name: Typecheck, Lint & Ratchets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Depth 2 gives the forward-only migration check a diff base (HEAD^1).
          fetch-depth: 2

      - name: Setup Environment
        uses: ./.github/actions/setup-mms
        with:
          turbo-cache-scope: typecheck-lint

      - name: Run Typecheck
        run: pnpm typecheck

      # Lints every package that has a lint script (frontend, backend,
      # @mms/shared, e2e) via turbo — shared/e2e were previously unlinted.
      - name: Lint (all packages)
        run: pnpm lint

      # Non-blocking visibility for warning-level rules that the errors-only
      # `lint` (`--quiet`) hides — currently react-hooks/exhaustive-deps.
      # Report only; make it blocking once the remaining warnings are triaged.
      - name: Lint warnings report (frontend, non-blocking)
        continue-on-error: true
        run: pnpm --filter mms-frontend lint:warn

      # Formatting is owned by Prettier (.prettierrc.json); ESLint defers all
      # stylistic rules to it via eslint-config-prettier (see each eslint.config.js).
      - name: Formatting (Prettier)
        run: pnpm format:check

      # Fails on high/critical advisories. One moderate finding is a reviewed,
      # documented exception (ts-deepmerge via @ts-rest/open-api) — see the
      # `overrides` block in pnpm-workspace.yaml and the OpenAPI test in
      # apps/backend/src/__tests__/app.health.test.ts for the full rationale.
      # Keeping this at `high` means the exception never masks a serious
      # advisory, which is the failure mode of blanket-ignoring audit output.
      - name: Dependency audit (high and critical)
        run: pnpm audit --audit-level=high || (sleep 30 && pnpm audit --audit-level=high)

      # Ratchet: no new bare `.select()` wildcard projections (mms-performance ban).
      - name: DB projection safety
        run: pnpm run check:db-projections

      # Ratchet: no new write-blocking CREATE INDEX on large tables in migrations.
      # CONCURRENTLY cannot live in a migration (Drizzle runs each migration run in
      # one transaction) — use `pnpm --filter mms-backend index:concurrent`.
      - name: Migration index lock safety
        run: pnpm run check:migration-indexes

      # Ratchet (ADR-011): route handlers must reach storage only through their
      # module's use-cases/repository seam. Catches static AND dynamic
      # `db/repositories` / `drizzle-orm` imports in apps/backend/src/routes/**.
      # Baseline is 0 — every offender has been migrated.
      - name: Backend route→storage boundary
        run: pnpm run check:backend-boundaries

      # Ratchet: the rest of the ports-and-adapters chain (use-case/services
      # storage imports, services/ re-export shims, tenant route aggregation).
      - name: Backend structural ratchets
        run: pnpm run check:backend-structure

      # Ratchet: docs/ index completeness, ADR numbering, and doc-tree clutter.
      - name: Documentation ratchets
        run: pnpm run check:docs

      # Ratchet: applied migrations are immutable (forward-only DDL). Rewriting one makes
      # fresh and existing installs diverge, and the change never reaches the latter.
      # `--base HEAD^1` is explicit so an unresolvable ref fails loudly instead of
      # producing an empty diff and passing vacuously (hence fetch-depth: 2 above).
      - name: Migrations are forward-only
        run: pnpm run check:migrations-forward-only -- --base HEAD^1

      # Ratchet: declared-but-unenforced norms (no `any` in source, no raw hex
      # colours outside @theme, file-size bands). Baselines live in the script.
      - name: Code-norm ratchets
        run: pnpm run check:code-norms

      # Ratchet: frontend structural norms (primitives vs composites in
      # components/ui, canonical feature shape, logic out of features/*/components,
      # UI helpers out of lib/ root, barrel allowlist). Baselines live in the script.
      - name: Frontend structure ratchets
        run: pnpm run check:frontend-structure

      # Ratchet: Work Directory convergence (selection SSOT, unified bulk chrome,
      # zero dual-render, zero shortcut stubs).
      - name: Work Directory convergence
        run: pnpm run check:work-directory

      # @mms/shared must stay an environment-agnostic leaf (no DOM/React/Fastify/
      # DB/Redis/Node builtins) so both the browser bundle and the Node backend
      # can safely import it. Comments/strings and test files are ignored.
      - name: "@mms/shared purity & boundaries"
        run: pnpm run check:shared-purity

      # Ratchet: @mms/shared stays de-flattened (domain folders, only index.ts at
      # src/ root) and consumers use the exported subpaths only.
      - name: "@mms/shared structure"
        run: pnpm run check:shared-structure

      # Guards the retired Teacher / FDA surface and asserts the canonical
      # Faculty schema + temporal-designation constraint are present.
      - name: Faculty domain legacy-surface check
        run: pnpm run check:faculty-domain

      # i18n key parity across en/ar/ur/fa. The script existed but ran in no
      # workflow, so translation drift was never actually gated.
      - name: i18n key parity
        run: pnpm run check:i18n

      - name: Verify Agent & Rule Mirrors Sync
        run: |
          bash .agent/scripts/sync-all.sh
          git diff --exit-code -- .agent .cursor .claude AGENTS.md || (echo "Agent rule/skill mirrors out of sync! Run 'bash .agent/scripts/sync-all.sh'" && exit 1)
          node scripts/verify-rules-integrity.mjs

  build:
    name: Build & Release Artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # id-token/attestations are only exercised on push to main, where the
    # release tarball is built once, attested, and promoted by deploy.yml.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: ./.github/actions/setup-mms
        with:
          turbo-cache-scope: build

      # Production build of all packages (validates Vite rollup build & backend compilation).
      # On push to main this is the release build, so it bakes the production domain.
      - name: Build (all packages)
        env:
          VITE_APP_DOMAIN: ${{ github.event_name == 'push' && secrets.MMS_APP_DOMAIN || '' }}
        run: pnpm build

      # Frontend bundle budget gate: catches chunk bloat and un-lazy-loaded dependencies
      - name: Frontend bundle budget
        run: pnpm run check:bundle

      # Build once, promote the same bytes: deploy.yml downloads this artifact
      # from the triggering CI run and verifies the provenance attestation.
      - name: Package release tarball
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bash scripts/ci/package-dist.sh

      - name: Attest build provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: mms-dist.tar.gz

      - name: Upload release artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mms-dist
          path: |
            mms-dist.tar.gz
            mms-dist.tar.gz.sha256
          # The repo maximum: a verified rollback (deploy.yml manual dispatch)
          # can only promote a commit whose artifact still exists.
          retention-days: 90
          if-no-files-found: error

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Scans the FULL git history: a credential that was committed and later
      # deleted is still recoverable from the repository and must be treated as
      # compromised. Image is pinned by digest (not `latest`) so the scanner
      # cannot change under us between runs. `--redact` keeps any finding out of
      # the CI log. Reviewed false positives live in .gitleaks.toml.
      - name: Secret scan (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" \
            zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source=/repo --config=/repo/.gitleaks.toml \
            --no-banner --redact --exit-code 1

  # Filename guard for sensitive files. `check-staged-secrets.mjs` inspects the
  # git index, which is empty in CI, so it runs with `--tracked` (whole tree).
  # Content secrets are covered by the full-history gitleaks job above; this
  # catches things like a committed `.env` or private key by NAME, at any depth.
  sensitive-file-guard:
    name: Sensitive File Guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Block committed sensitive filenames
        run: node scripts/check-staged-secrets.mjs --tracked

  test-frontend:
    # No matrix values in the name: a skipped matrix job is never expanded, so
    # GitHub would show the raw template. Running jobs get "(index, total)" appended.
    name: Frontend Tests
    needs: [changes]
    if: ${{ needs.changes.outputs.frontend == 'true' || github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Changed-scope PRs run one unsharded job; full scope uses four shards.
    # Vitest splits files by a hash of their path, not by duration, so three
    # shards ran 103-146s; more, smaller shards narrow that spread.
    strategy:
      fail-fast: false
      matrix:
        shardIndex: ${{ fromJSON(needs.changes.outputs.test_scope == 'full' && '[1, 2, 3, 4]' || '[1]') }}
        shardTotal: ${{ fromJSON(needs.changes.outputs.test_scope == 'full' && '[4]' || '[1]') }}
    steps:
      # Changed scope diffs against HEAD^1: a PR checkout is the merge commit,
      # whose first parent is the base branch, so depth 2 is enough.
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ needs.changes.outputs.test_scope == 'changed' && 2 || 1 }}

      - name: Setup Environment
        uses: ./.github/actions/setup-mms
        with:
          build-shared: "true"

      - name: Run Frontend Tests (changed files only, no coverage)
        if: needs.changes.outputs.test_scope == 'changed'
        run: pnpm --filter mms-frontend exec vitest run --changed HEAD^1 --passWithNoTests --reporter=default --reporter=github-actions

      # The matrix is built from a job output, so it reaches the shell through
      # env rather than inline template expansion (zizmor template-injection).
      - name: Run Frontend Test Shard & Generate Blob Report
        if: needs.changes.outputs.test_scope == 'full'
        env:
          SHARD_INDEX: ${{ matrix.shardIndex }}
          SHARD_TOTAL: ${{ matrix.shardTotal }}
        run: |
          mkdir -p apps/frontend/.vitest-reports
          pnpm --filter mms-frontend exec vitest run \
            --shard="${SHARD_INDEX}/${SHARD_TOTAL}" \
            --coverage \
            --coverage.thresholds.lines=0 \
            --coverage.thresholds.statements=0 \
            --coverage.thresholds.functions=0 \
            --coverage.thresholds.branches=0 \
            --reporter=default \
            --reporter=github-actions \
            --reporter=blob \
            --outputFile=".vitest-reports/blob-${SHARD_INDEX}.json"

      - name: Upload Shard Report Artifact
        if: always() && needs.changes.outputs.test_scope == 'full'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-blob-report-${{ matrix.shardIndex }}
          path: apps/frontend/.vitest-reports/blob-${{ matrix.shardIndex }}.json
          retention-days: 1

  test-frontend-coverage:
    name: Frontend Coverage Gate
    needs: [changes, test-frontend]
    # Coverage thresholds are global, so they only mean something on a full run;
    # changed-scope PRs skip this gate and main enforces it on every push.
    if: ${{ (needs.changes.outputs.frontend == 'true' || github.event_name != 'pull_request') && needs.changes.outputs.test_scope == 'full' && !cancelled() && needs['test-frontend'].result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Merging blob reports runs no tests, so @mms/shared need not be built.
      - name: Setup Environment
        uses: ./.github/actions/setup-mms

      - name: Download All Shard Report Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: vitest-blob-report-*
          merge-multiple: true
          path: apps/frontend/.vitest-reports

      - name: Merge Shard Reports & Enforce Coverage Gate
        run: |
          mkdir -p apps/frontend/.vitest-reports
          if [ -d "apps/frontend/.vitest-reports" ] && [ "$(ls -A apps/frontend/.vitest-reports)" ]; then
            pnpm --filter mms-frontend exec vitest run --merge-reports=.vitest-reports --coverage
          else
            echo "::error::No vitest blob reports found in apps/frontend/.vitest-reports to merge!"
            exit 1
          fi

  test-backend-unit:
    # No matrix values in the name: a skipped matrix job is never expanded, so
    # GitHub would show the raw template. Running jobs get "(index, total)" appended.
    name: Backend Unit Tests
    needs: [changes]
    if: ${{ needs.changes.outputs.backend_unit == 'true' || github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Changed-scope PRs run one unsharded job; full scope keeps two shards.
    strategy:
      fail-fast: false
      matrix:
        shardIndex: ${{ fromJSON(needs.changes.outputs.test_scope == 'full' && '[1, 2]' || '[1]') }}
        shardTotal: ${{ fromJSON(needs.changes.outputs.test_scope == 'full' && '[2]' || '[1]') }}
    steps:
      # Changed scope diffs against HEAD^1: a PR checkout is the merge commit,
      # whose first parent is the base branch, so depth 2 is enough.
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ needs.changes.outputs.test_scope == 'changed' && 2 || 1 }}

      - name: Setup Environment
        uses: ./.github/actions/setup-mms
        with:
          build-shared: "true"

      # Any packages/shared change forces full scope, so changed scope skips it.
      - name: Run Shared Package Tests & Coverage
        if: matrix.shardIndex == 1 && needs.changes.outputs.test_scope == 'full'
        run: pnpm --filter @mms/shared test:coverage

      - name: Run Backend Unit Tests (changed files only)
        if: needs.changes.outputs.test_scope == 'changed'
        run: pnpm --filter mms-backend exec vitest run --changed HEAD^1 --passWithNoTests

      # Shards collect coverage (thresholds zeroed — a shard only sees a slice of
      # the suite, so a per-shard percentage is meaningless) and emit a blob
      # report; `test-backend-coverage` merges them and enforces the real
      # thresholds from apps/backend/vitest.config.ts globally.
      - name: Run Backend Unit Tests Shard & Generate Blob Report
        if: needs.changes.outputs.test_scope == 'full'
        env:
          SHARD_INDEX: ${{ matrix.shardIndex }}
          SHARD_TOTAL: ${{ matrix.shardTotal }}
        run: |
          mkdir -p apps/backend/.vitest-reports
          pnpm --filter mms-backend exec vitest run \
            --shard="${SHARD_INDEX}/${SHARD_TOTAL}" \
            --coverage \
            --coverage.thresholds.lines=0 \
            --coverage.thresholds.statements=0 \
            --coverage.thresholds.functions=0 \
            --coverage.thresholds.branches=0 \
            --reporter=default \
            --reporter=github-actions \
            --reporter=blob \
            --outputFile=".vitest-reports/blob-${SHARD_INDEX}.json"

      - name: Upload Shard Report Artifact
        if: always() && needs.changes.outputs.test_scope == 'full'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-vitest-blob-report-${{ matrix.shardIndex }}
          path: apps/backend/.vitest-reports/blob-${{ matrix.shardIndex }}.json
          retention-days: 1

  test-backend-coverage:
    name: Backend Coverage Gate
    needs: [changes, test-backend-unit]
    # Coverage thresholds are global, so they only mean something on a full run;
    # changed-scope PRs skip this gate and main enforces it on every push.
    if: ${{ (needs.changes.outputs.backend_unit == 'true' || github.event_name != 'pull_request') && needs.changes.outputs.test_scope == 'full' && !cancelled() && needs['test-backend-unit'].result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: ./.github/actions/setup-mms
        with:
          build-shared: "true"

      - name: Download All Shard Report Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: backend-vitest-blob-report-*
          merge-multiple: true
          path: apps/backend/.vitest-reports

      # Merging blob reports runs no tests, but it does evaluate the merged
      # coverage, so the thresholds in apps/backend/vitest.config.ts are enforced
      # here against the whole suite (shards zeroed them deliberately).
      - name: Merge Shard Reports & Enforce Coverage Gate
        run: |
          mkdir -p apps/backend/.vitest-reports
          if [ -d "apps/backend/.vitest-reports" ] && [ "$(ls -A apps/backend/.vitest-reports)" ]; then
            pnpm --filter mms-backend exec vitest run --merge-reports=.vitest-reports --coverage
          else
            echo "::error::No vitest blob reports found in apps/backend/.vitest-reports to merge!"
            exit 1
          fi

  test-backend-db:
    name: Backend DB Integration Tests
    needs: [changes]
    if: >
      !github.event.pull_request.draft &&
      (needs.changes.outputs.backend_db == 'true' || github.event_name != 'pull_request')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mms
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
          --tmpfs /var/lib/postgresql/data:rw,noexec,nosuid,size=1024m

    env:
      JWT_SECRET: "e2e-test-jwt-secret-key-at-least-32-chars-long"
      DATABASE_URL: "postgres://postgres:postgres@localhost:5432/mms"
      NODE_ENV: "test"
      LOG_LEVEL: "silent"

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: ./.github/actions/setup-mms
        with:
          build-shared: "true"

      - name: Run DB Migrations
        run: pnpm --filter mms-backend run db:migrate

      - name: Run Backend DB Integration Tests
        run: pnpm --filter mms-backend run test:db

  e2e:
    needs: [changes]
    if: >
      !github.event.pull_request.draft &&
      (needs.changes.outputs.e2e == 'true' || github.event_name != 'pull_request')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Two Playwright projects, two shards each (playwright.config.ts). A shard
    # is a contiguous slice of tests by count, so the long axe sweeps (`a11y`)
    # get their own runners instead of all landing on shard 1.
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, a11y]
        shardIndex: [1, 2]
        shardTotal: [2]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mms
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
          --tmpfs /var/lib/postgresql/data:rw,noexec,nosuid,size=1024m

    env:
      JWT_SECRET: "e2e-test-jwt-secret-key-at-least-32-chars-long"
      DATABASE_URL: "postgres://postgres:postgres@localhost:5432/mms"
      NODE_ENV: "test"
      LOG_LEVEL: "warn"

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: ./.github/actions/setup-mms
        with:
          build-shared: "true"

      - name: Run DB Migrations
        run: pnpm --filter mms-backend run db:migrate

      - name: Cache Playwright Binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium Browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter e2e-tests exec playwright install chromium

      - name: Run E2E Tests with Sharding
        env:
          PROJECT: ${{ matrix.project }}
          SHARD_INDEX: ${{ matrix.shardIndex }}
          SHARD_TOTAL: ${{ matrix.shardTotal }}
          # Unique per leg: the default `report-<shard>.zip` collides across
          # projects when merge-reports downloads every blob into one folder.
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-${{ matrix.project }}-${{ matrix.shardIndex }}.zip
        run: pnpm test:e2e --project="${PROJECT}" --shard="${SHARD_INDEX}/${SHARD_TOTAL}"

      - name: Upload Blob Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blob-report-${{ matrix.project }}-${{ matrix.shardIndex }}
          path: e2e/blob-report
          retention-days: 1

  merge-reports:
    if: always() && needs.e2e.result != 'skipped' && needs.e2e.result != 'cancelled'
    needs: [e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: ./.github/actions/setup-mms

      - name: Download Blob Reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge Playwright Reports
        run: |
          if [ -d "all-blob-reports" ] && [ "$(ls -A all-blob-reports)" ]; then
            pnpm --filter e2e-tests run merge-reports ../all-blob-reports --reporter html
          else
            echo "No blob reports found to merge. Skipping..."
          fi

      - name: Upload HTML Report Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-html-report
          path: e2e/playwright-report
          retention-days: 7

  ci-gate:
    name: CI Gate (All Checks Passed)
    if: always()
    needs:
      [
        changes,
        dependency-review,
        workflow-lint,
        typecheck-lint,
        build,
        secret-scan,
        sensitive-file-guard,
        test-frontend,
        test-frontend-coverage,
        test-backend-unit,
        test-backend-coverage,
        test-backend-db,
        e2e,
        merge-reports,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Evaluate CI Gate & Publish Summary
        env:
          EVENT_NAME: ${{ github.event_name }}
          TEST_SCOPE: ${{ needs.changes.outputs.test_scope }}
        run: |
          echo "==================== CI Gate Summary ===================="
          echo "Unit test scope:        ${TEST_SCOPE}"
          echo "Dependency Review:     ${{ needs.dependency-review.result }}"
          echo "Workflow Lint:         ${{ needs.workflow-lint.result }}"
          echo "Typecheck & Lint:       ${{ needs.typecheck-lint.result }}"
          echo "Build & Release:        ${{ needs.build.result }}"
          echo "Secret Scan:            ${{ needs.secret-scan.result }}"
          echo "Sensitive File Guard:   ${{ needs.sensitive-file-guard.result }}"
          echo "Frontend Tests:         ${{ needs.test-frontend.result }}"
          echo "Frontend Coverage:      ${{ needs.test-frontend-coverage.result }}"
          echo "Backend Unit Tests:     ${{ needs.test-backend-unit.result }}"
          echo "Backend Coverage:       ${{ needs.test-backend-coverage.result }}"
          echo "Backend DB Tests:       ${{ needs.test-backend-db.result }}"
          echo "E2E Tests:              ${{ needs.e2e.result }}"
          echo "E2E Merge Reports:      ${{ needs.merge-reports.result }}"
          echo "========================================================="

          failed=0

          # Only full-scope runs may pass outside PRs: a green push run on main is
          # what deploy.yml promotes, so it must mean the full suites ran.
          if [ "${EVENT_NAME}" != "pull_request" ] && [ "${TEST_SCOPE}" != "full" ]; then
            echo "::error::non-PR run used test scope '${TEST_SCOPE}' — main must run full tests"
            failed=1
          fi

          if [ "${{ needs.dependency-review.result }}" != "success" ] && [ "${{ needs.dependency-review.result }}" != "skipped" ]; then
            echo "::error::dependency-review failed or was cancelled (result: ${{ needs.dependency-review.result }})"
            failed=1
          fi

          if [ "${{ needs.workflow-lint.result }}" != "success" ]; then
            echo "::error::workflow-lint failed or was cancelled (result: ${{ needs.workflow-lint.result }})"
            failed=1
          fi

          if [ "${{ needs.typecheck-lint.result }}" != "success" ]; then
            echo "::error::typecheck-lint failed or was cancelled (result: ${{ needs.typecheck-lint.result }})"
            failed=1
          fi

          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::build failed or was cancelled (result: ${{ needs.build.result }})"
            failed=1
          fi

          if [ "${{ needs.secret-scan.result }}" != "success" ]; then
            echo "::error::secret-scan failed or was cancelled (result: ${{ needs.secret-scan.result }})"
            failed=1
          fi

          if [ "${{ needs.sensitive-file-guard.result }}" != "success" ]; then
            echo "::error::sensitive-file-guard failed or was cancelled (result: ${{ needs.sensitive-file-guard.result }})"
            failed=1
          fi

          if [ "${{ needs.test-frontend.result }}" != "success" ] && [ "${{ needs.test-frontend.result }}" != "skipped" ]; then
            echo "::error::test-frontend failed or was cancelled (result: ${{ needs.test-frontend.result }})"
            failed=1
          fi

          if [ "${{ needs.test-frontend-coverage.result }}" != "success" ] && [ "${{ needs.test-frontend-coverage.result }}" != "skipped" ]; then
            echo "::error::test-frontend-coverage failed or was cancelled (result: ${{ needs.test-frontend-coverage.result }})"
            failed=1
          fi

          if [ "${{ needs.test-backend-unit.result }}" != "success" ] && [ "${{ needs.test-backend-unit.result }}" != "skipped" ]; then
            echo "::error::test-backend-unit failed or was cancelled (result: ${{ needs.test-backend-unit.result }})"
            failed=1
          fi

          if [ "${{ needs.test-backend-coverage.result }}" != "success" ] && [ "${{ needs.test-backend-coverage.result }}" != "skipped" ]; then
            echo "::error::test-backend-coverage failed or was cancelled (result: ${{ needs.test-backend-coverage.result }})"
            failed=1
          fi

          if [ "${{ needs.test-backend-db.result }}" != "success" ] && [ "${{ needs.test-backend-db.result }}" != "skipped" ]; then
            echo "::error::test-backend-db failed or was cancelled (result: ${{ needs.test-backend-db.result }})"
            failed=1
          fi

          if [ "${{ needs.e2e.result }}" != "success" ] && [ "${{ needs.e2e.result }}" != "skipped" ]; then
            echo "::error::e2e failed or was cancelled (result: ${{ needs.e2e.result }})"
            failed=1
          fi

          if [ "${{ needs.merge-reports.result }}" != "success" ] && [ "${{ needs.merge-reports.result }}" != "skipped" ]; then
            echo "::error::merge-reports failed or was cancelled (result: ${{ needs.merge-reports.result }})"
            failed=1
          fi

          if [ "$failed" -ne 0 ]; then
            STATUS_HEADER="❌ MMS CI Gate Status: Failed"
          else
            STATUS_HEADER="🚀 MMS CI Gate Status: Passed"
          fi

          cat << EOF >> "$GITHUB_STEP_SUMMARY"
          ### ${STATUS_HEADER}

          Unit test scope: \`${TEST_SCOPE}\`

          | Quality Check | Status | Execution Mode |
          |---|---|---|
          | **Dependency Review** | \`${{ needs.dependency-review.result }}\` | High/Critical Advisory Check (PRs) |
          | **Workflow Lint** | \`${{ needs.workflow-lint.result }}\` | actionlint + zizmor |
          | **Typecheck, Lint & Ratchets** | \`${{ needs.typecheck-lint.result }}\` | Turbo Cache (parallel job) |
          | **Build & Release Artifact** | \`${{ needs.build.result }}\` | Build + Bundle Budget (parallel job) |
          | **Secret Scan** | \`${{ needs.secret-scan.result }}\` | gitleaks, full history (parallel job) |
          | **Sensitive File Guard** | \`${{ needs.sensitive-file-guard.result }}\` | Whole-tree sensitive-filename blocklist |
          | **Frontend Tests** | \`${{ needs.test-frontend.result }}\` | 2-Way Sharded Parallel Matrix |
          | **Frontend Coverage** | \`${{ needs.test-frontend-coverage.result }}\` | Merged Blob Reports & Coverage Enforcement |
          | **Backend Unit Tests** | \`${{ needs.test-backend-unit.result }}\` | 2-Way Sharded In-Memory Unit |
          | **Backend Coverage** | \`${{ needs.test-backend-coverage.result }}\` | Merged Blob Reports & Coverage Enforcement |
          | **Backend DB Tests** | \`${{ needs.test-backend-db.result }}\` | Docker Postgres 16 (Healthchecked, tmpfs) |
          | **E2E Tests** | \`${{ needs.e2e.result }}\` | 4-Way Sharded Playwright Matrix |
          | **E2E Report Merge** | \`${{ needs.merge-reports.result }}\` | Merged HTML Playwright Report |
          EOF

          if [ "$failed" -ne 0 ]; then
            echo "CI Gate failed: One or more required checks did not succeed."
            exit 1
          fi

          echo "CI Gate passed: All required checks succeeded (or were safely bypassed via hermetic path filtering)."
