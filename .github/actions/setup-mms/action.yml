name: "Setup MMS Environment"
description: "Standardized environment setup with bounded Turbo cache, pnpm/Node 24, incremental tool caches, and offline-preferred dependency installation"

inputs:
  install:
    description: "Whether to run pnpm install"
    required: false
    default: "true"
  install-filter:
    description: "Optional pnpm --filter expression for a slim install (e.g. e2e-tests...), used by report/coverage jobs that need one workspace project"
    required: false
    default: ""
  build-shared:
    description: "Whether to compile @mms/shared"
    required: false
    default: "false"
  turbo-cache-scope:
    description: "Separates the Turbo cache key per job so parallel jobs on one commit do not race to save the same key"
    required: false
    default: "shared"

runs:
  using: "composite"
  steps:
    # The archive is saved per commit. Caching the whole `.turbo` directory made
    # each entry grow without bound (the `build` scope reached 1.6 GB per commit,
    # ~8 GB of the repo's 10 GB budget) and evicted the pnpm/Playwright caches.
    # Cache only turbo's artifact directory plus the per-package incremental
    # tsc/eslint caches, and prune it after restore so every save is bounded.
    - name: Cache Turbo and tool caches
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .turbo/cache
          apps/*/node_modules/.cache/tsc
          apps/*/node_modules/.cache/eslint
          packages/*/node_modules/.cache/tsc
          packages/*/node_modules/.cache/eslint
          e2e/node_modules/.cache/eslint
        key: turbo-${{ runner.os }}-${{ inputs.turbo-cache-scope }}-${{ hashFiles('pnpm-lock.yaml') }}-v2-${{ github.sha }}
        # `-v2-` scopes the fallbacks too: the pre-v2 snapshots must not be
        # restored again, so the oversized entries age out by LRU eviction
        # instead of being re-imported and re-saved on every run.
        restore-keys: |
          turbo-${{ runner.os }}-${{ inputs.turbo-cache-scope }}-${{ hashFiles('pnpm-lock.yaml') }}-v2-
          turbo-${{ runner.os }}-${{ inputs.turbo-cache-scope }}-v2-

    - name: Setup pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: "pnpm"

    # Runs before install/build, so the post-job cache save archives the pruned
    # set plus this run's new artifacts (cap 350 MB, entries older than 14 days).
    - name: Prune Turbo cache
      shell: bash
      run: node scripts/ci/prune-turbo-cache.mjs --dir .turbo/cache --max-mb 350 --max-age-days 14

    - name: Install Dependencies
      if: inputs.install == 'true'
      shell: bash
      env:
        INSTALL_FILTER: ${{ inputs.install-filter }}
      run: |
        if [ -n "${INSTALL_FILTER}" ]; then
          pnpm install --frozen-lockfile --prefer-offline --filter "${INSTALL_FILTER}"
        else
          pnpm install --frozen-lockfile --prefer-offline
        fi

    - name: Build shared package
      if: inputs.build-shared == 'true'
      shell: bash
      run: pnpm --filter @mms/shared build
