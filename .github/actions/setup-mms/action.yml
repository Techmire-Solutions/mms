name: "Setup MMS Environment"
description: "Standardized environment setup with Turbo cache, pnpm, Node 24, and offline-preferred dependency installation"

inputs:
  install:
    description: "Whether to run pnpm install"
    required: false
    default: "true"
  build-shared:
    description: "Whether to compile @mms/shared"
    required: false
    default: "false"
  turbo-cache-scope:
    description: "Separates the Turbo cache key per job so parallel jobs on one commit do not race to save the same key"
    required: false
    default: "shared"

runs:
  using: "composite"
  steps:
    - name: Cache Turbo (incremental state)
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4.2.2
      with:
        path: |
          .turbo
          node_modules/.cache/turbo
        key: turbo-${{ runner.os }}-${{ inputs.turbo-cache-scope }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ inputs.turbo-cache-scope }}-${{ hashFiles('pnpm-lock.yaml') }}-
          turbo-${{ runner.os }}-${{ inputs.turbo-cache-scope }}-

    - name: Setup pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.2.0
      with:
        node-version-file: .nvmrc
        cache: "pnpm"

    - name: Install Dependencies
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile --prefer-offline

    - name: Build shared package
      if: inputs.build-shared == 'true'
      shell: bash
      run: pnpm --filter @mms/shared build
