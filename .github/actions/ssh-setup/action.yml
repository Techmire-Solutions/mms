name: "Setup Production SSH"
description: "Writes the deploy key and a pinned known_hosts for scripts/ci/ssh-exec.sh"

inputs:
  private-key:
    description: "SSH private key for the production host"
    required: true
  known-hosts:
    description: "Pinned known_hosts entries for the production host — get this by running: ssh-keyscan -H <SERVER_IP> (store as SSH_KNOWN_HOSTS secret)"
    required: true
  host:
    description: "Production host (only used for the trust-on-first-use fallback)"
    required: true

runs:
  using: "composite"
  steps:
    # Pinned known_hosts is the trust anchor; keyscan at job time is
    # trust-on-first-use and only kept as a warned fallback until it is set.
    - name: Write deploy key and known_hosts
      shell: bash
      env:
        SSH_PRIVATE_KEY: ${{ inputs.private-key }}
        SSH_KNOWN_HOSTS: ${{ inputs.known-hosts }}
        SERVER_IP: ${{ inputs.host }}
      run: |
        set -euo pipefail
        umask 077
        mkdir -p ~/.ssh
        # Write the deploy key with strict permissions
        printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        # Use pinned known_hosts — trust-on-first-use keyscan is not allowed
        # (it is vulnerable to MITM between the runner and the production host).
        # Set SSH_KNOWN_HOSTS secret: ssh-keyscan -H <SERVER_IP>
        printf '%s\n' "${SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
        chmod 600 ~/.ssh/known_hosts
        # SSH client config so downstream steps don't need -i flags
        cat >> ~/.ssh/config <<EOF
        Host ${SERVER_IP}
          IdentityFile ~/.ssh/deploy_key
          StrictHostKeyChecking yes
          BatchMode yes
          ConnectTimeout 10
        EOF
        chmod 600 ~/.ssh/config
