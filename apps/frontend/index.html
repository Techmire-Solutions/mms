<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <!-- Root fallback for legacy browsers -->
    <link rel="icon" href="/favicon.ico" sizes="any" />

    <!-- Vector icon for modern browsers with light/dark theme support -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- Apple touch icon -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Web App Manifest for Android/PWA -->
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    />
    <!--
      Display face. Loaded as a <link> (not `@import` inside index.css): a CSS
      @import is discovered only after the stylesheet is parsed, so it serialised
      the render and was invisible to the preload scanner.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Modern Web Guidance: respect-os-text-scale (opt into OS-level dynamic type and accessibility text scaling) -->
    <meta name="text-scale" content="scale" />
    <meta
      name="description"
      content="Secure portal to manage students, attendance, finance, examinations, and question banks for Madrasa Management System (MMS) workspaces."
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MMS" />
    <meta name="format-detection" content="telephone=no" />
    <title>MMS - Madrasa Management System</title>
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <noscript>
      <div style="padding: 2rem; text-align: center; font-family: system-ui, sans-serif">
        <h2>JavaScript Required</h2>
        <p>
          Please enable JavaScript in your browser to access the Madrasa Management System portal.
        </p>
      </div>
    </noscript>
    <div id="root">
      <div
        style="
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          background-color: #fbf9f4;
          font-family: system-ui, sans-serif;
        "
      >
        <div
          class="mms-initial-spinner"
          style="
            width: 32px;
            height: 32px;
            border: 3px solid rgba(202, 138, 4, 0.2);
            border-top-color: #ca8a04;
            border-radius: 50%;
            animation: mms-spin 0.8s linear infinite;
          "
        ></div>
        <style>
          @keyframes mms-spin {
            to {
              transform: rotate(360deg);
            }
          }
          @media (prefers-reduced-motion: reduce) {
            .mms-initial-spinner {
              animation-duration: 6s !important;
            }
          }
          .dark #root > div {
            background-color: #171410 !important;
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
