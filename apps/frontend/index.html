<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <!-- Root fallback for legacy browsers -->
    <link rel="icon" href="/favicon.ico" sizes="any" />

    <!-- Vector icon for modern browsers with light/dark theme support -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- Apple touch icon -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Web App Manifest for Android/PWA -->
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Modern Web Guidance: respect-os-text-scale (opt into OS-level dynamic type and accessibility text scaling) -->
    <meta name="text-scale" content="scale" />
    <meta
      name="description"
      content="Secure portal to manage students, attendance, finance, examinations, and question banks for Madrasa Management System (MMS) workspaces."
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MMS" />
    <meta name="format-detection" content="telephone=no" />
    <title>MMS - Madrasa Management System</title>
    <script src="/theme-init.js" defer></script>
  </head>
  <body>
    <noscript>
      <div style="padding: 2rem; text-align: center; font-family: system-ui, sans-serif">
        <h2>JavaScript Required</h2>
        <p>
          Please enable JavaScript in your browser to access the Madrasa Management System portal.
        </p>
      </div>
    </noscript>
    <div id="root">
      <div class="mms-app-boot-skeleton">
        <!-- Critical Inline CSS for instant dark-mode / light-mode boot without white flash -->
        <style>
          :root {
            --mms-boot-bg: #fbf9f4;
            --mms-boot-card: #ffffff;
            --mms-boot-border: rgba(0, 0, 0, 0.08);
            --mms-boot-muted: rgba(0, 0, 0, 0.06);
            --mms-boot-primary: #0f766e;
          }
          html.dark,
          .dark {
            --mms-boot-bg: #171410;
            --mms-boot-card: #221e1a;
            --mms-boot-border: rgba(255, 255, 255, 0.08);
            --mms-boot-muted: rgba(255, 255, 255, 0.06);
            --mms-boot-primary: #14b8a6;
          }
          body {
            background-color: var(--mms-boot-bg);
            margin: 0;
            padding: 0;
          }
          .mms-app-boot-skeleton {
            min-height: 100vh;
            background-color: var(--mms-boot-bg);
            font-family:
              system-ui,
              -apple-system,
              BlinkMacSystemFont,
              "Segoe UI",
              Roboto,
              sans-serif;
            display: flex;
            flex-direction: column;
            color: inherit;
          }
          .mms-top-bar {
            height: 56px;
            border-bottom: 1px solid var(--mms-boot-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            background-color: var(--mms-boot-card);
            box-sizing: border-box;
          }
          .mms-main-content {
            flex: 1;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 1280px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
          }
          .mms-welcome-banner {
            border-radius: 16px;
            border: 1px solid var(--mms-boot-border);
            background-color: var(--mms-boot-card);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
          }
          .mms-cards-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
          }
          @media (min-width: 640px) {
            .mms-cards-grid {
              grid-template-columns: repeat(3, minmax(0, 1fr));
              gap: 16px;
            }
          }
          @media (min-width: 1280px) {
            .mms-cards-grid {
              grid-template-columns: repeat(4, minmax(0, 1fr));
            }
          }
          .mms-card-skeleton {
            border-radius: 16px;
            border: 1px solid var(--mms-boot-border);
            background-color: var(--mms-boot-card);
            padding: 20px;
            min-height: 128px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
          }
          .mms-shimmer-box {
            background-color: var(--mms-boot-muted);
            border-radius: 6px;
          }
          @media (prefers-reduced-motion: no-preference) {
            .mms-pulse-anim {
              animation: mms-fade-pulse 1.8s cubic-bezier(0.4, 0, 0.6, 1) infinite;
            }
          }
          @keyframes mms-fade-pulse {
            0%,
            100% {
              opacity: 1;
            }
            50% {
              opacity: 0.55;
            }
          }
        </style>

        <!-- Top Header Skeleton matching 56px height & 44px min touch target -->
        <header class="mms-top-bar" aria-hidden="true">
          <div style="display: flex; align-items: center; gap: 12px">
            <div
              class="mms-shimmer-box"
              style="width: 36px; height: 36px; border-radius: 8px"
            ></div>
            <div class="mms-shimmer-box" style="width: 120px; height: 18px"></div>
          </div>
          <div style="display: flex; align-items: center; gap: 8px">
            <div
              class="mms-shimmer-box"
              style="width: 36px; height: 36px; border-radius: 8px"
            ></div>
            <div
              class="mms-shimmer-box"
              style="width: 36px; height: 36px; border-radius: 8px"
            ></div>
          </div>
        </header>

        <!-- Main Dashboard View Container matching final dimensions -->
        <main class="mms-main-content mms-pulse-anim" aria-hidden="true">
          <!-- Welcome Banner Skeleton -->
          <div class="mms-welcome-banner">
            <div
              class="mms-shimmer-box"
              style="width: 80px; height: 14px; background-color: rgba(15, 118, 110, 0.2)"
            ></div>
            <div class="mms-shimmer-box" style="width: 240px; height: 26px"></div>
            <div class="mms-shimmer-box" style="width: 180px; height: 14px"></div>
          </div>

          <!-- 4 KPI Cards Grid matching final layout -->
          <div class="mms-cards-grid">
            <div class="mms-card-skeleton">
              <div style="display: flex; justify-content: space-between; align-items: center">
                <div
                  class="mms-shimmer-box"
                  style="width: 36px; height: 36px; border-radius: 8px"
                ></div>
                <div class="mms-shimmer-box" style="width: 48px; height: 18px"></div>
              </div>
              <div style="display: flex; flex-direction: column; gap: 6px">
                <div class="mms-shimmer-box" style="width: 80px; height: 24px"></div>
                <div class="mms-shimmer-box" style="width: 110px; height: 12px"></div>
              </div>
            </div>
            <div class="mms-card-skeleton">
              <div style="display: flex; justify-content: space-between; align-items: center">
                <div
                  class="mms-shimmer-box"
                  style="width: 36px; height: 36px; border-radius: 8px"
                ></div>
                <div class="mms-shimmer-box" style="width: 48px; height: 18px"></div>
              </div>
              <div style="display: flex; flex-direction: column; gap: 6px">
                <div class="mms-shimmer-box" style="width: 80px; height: 24px"></div>
                <div class="mms-shimmer-box" style="width: 110px; height: 12px"></div>
              </div>
            </div>
            <div class="mms-card-skeleton">
              <div style="display: flex; justify-content: space-between; align-items: center">
                <div
                  class="mms-shimmer-box"
                  style="width: 36px; height: 36px; border-radius: 8px"
                ></div>
                <div class="mms-shimmer-box" style="width: 48px; height: 18px"></div>
              </div>
              <div style="display: flex; flex-direction: column; gap: 6px">
                <div class="mms-shimmer-box" style="width: 80px; height: 24px"></div>
                <div class="mms-shimmer-box" style="width: 110px; height: 12px"></div>
              </div>
            </div>
            <div class="mms-card-skeleton">
              <div style="display: flex; justify-content: space-between; align-items: center">
                <div
                  class="mms-shimmer-box"
                  style="width: 36px; height: 36px; border-radius: 8px"
                ></div>
                <div class="mms-shimmer-box" style="width: 48px; height: 18px"></div>
              </div>
              <div style="display: flex; flex-direction: column; gap: 6px">
                <div class="mms-shimmer-box" style="width: 80px; height: 24px"></div>
                <div class="mms-shimmer-box" style="width: 110px; height: 12px"></div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
