<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <!-- Root fallback for legacy browsers -->
    <link rel="icon" href="/favicon.ico" sizes="any" />

    <!-- Vector icon for modern browsers with light/dark theme support -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- Apple touch icon -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Web App Manifest for Android/PWA -->
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
      />
    </noscript>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Modern Web Guidance: respect-os-text-scale (opt into OS-level dynamic type and accessibility text scaling) -->
    <meta name="text-scale" content="scale" />
    <meta
      name="description"
      content="Secure portal to manage students, attendance, finance, examinations, and question banks for Madrasa Management System (MMS) workspaces."
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MMS" />
    <meta name="format-detection" content="telephone=no" />
    <title>MMS - Madrasa Management System</title>
    <script src="/theme-init.js" defer></script>
  </head>
  <body>
    <noscript>
      <div style="padding: 2rem; text-align: center; font-family: system-ui, sans-serif">
        <h2>JavaScript Required</h2>
        <p>
          Please enable JavaScript in your browser to access the Madrasa Management System portal.
        </p>
      </div>
    </noscript>
    <div id="root">
      <div
        class="mms-app-boot-skeleton"
        style="
          min-height: 100vh;
          background-color: #fbf9f4;
          font-family:
            system-ui,
            -apple-system,
            BlinkMacSystemFont,
            &quot;Segoe UI&quot;,
            Roboto,
            sans-serif;
          display: flex;
          flex-direction: column;
        "
      >
        <!-- Lightweight Mobile Top Bar Placeholder -->
        <div
          style="
            height: 56px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 12px;
          "
        >
          <div
            style="
              width: 24px;
              height: 24px;
              border-radius: 6px;
              background-color: rgba(0, 0, 0, 0.06);
            "
          ></div>
          <div
            style="
              width: 28px;
              height: 28px;
              border-radius: 6px;
              background-color: rgba(15, 118, 110, 0.15);
            "
          ></div>
          <div
            style="
              width: 110px;
              height: 16px;
              border-radius: 4px;
              background-color: rgba(0, 0, 0, 0.08);
            "
          ></div>
        </div>

        <!-- Lightweight Body / Module Scaffold Placeholder -->
        <div
          style="
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 1280px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
          "
        >
          <!-- Module Header Skeleton -->
          <div
            style="display: flex; align-items: center; justify-content: space-between; gap: 12px"
          >
            <div style="display: flex; align-items: center; gap: 12px">
              <div
                style="
                  width: 36px;
                  height: 36px;
                  border-radius: 10px;
                  background-color: rgba(15, 118, 110, 0.15);
                "
              ></div>
              <div style="display: flex; flex-direction: column; gap: 6px">
                <div
                  style="
                    width: 120px;
                    height: 20px;
                    border-radius: 4px;
                    background-color: rgba(0, 0, 0, 0.1);
                  "
                ></div>
                <div
                  style="
                    width: 180px;
                    height: 14px;
                    border-radius: 4px;
                    background-color: rgba(0, 0, 0, 0.05);
                  "
                ></div>
              </div>
            </div>
            <div
              style="
                width: 90px;
                height: 36px;
                border-radius: 8px;
                background-color: rgba(0, 0, 0, 0.06);
              "
            ></div>
          </div>

          <!-- Spinner & status pulse -->
          <div style="display: flex; align-items: center; justify-content: center; padding: 48px 0">
            <div
              class="mms-initial-spinner"
              style="
                width: 28px;
                height: 28px;
                border: 3px solid rgba(202, 138, 4, 0.2);
                border-top-color: #ca8a04;
                border-radius: 50%;
                animation: mms-spin 0.8s linear infinite;
              "
            ></div>
          </div>
        </div>

        <style>
          @keyframes mms-spin {
            to {
              transform: rotate(360deg);
            }
          }
          @media (prefers-reduced-motion: reduce) {
            .mms-initial-spinner {
              animation-duration: 6s !important;
            }
          }
          .dark .mms-app-boot-skeleton {
            background-color: #171410 !important;
          }
          .dark .mms-app-boot-skeleton > div:first-child {
            border-bottom-color: rgba(255, 255, 255, 0.08) !important;
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
