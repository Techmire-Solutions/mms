packages:
  - "apps/*"
  - "packages/*"
  - "e2e"

confirmModulesPurge: false

allowBuilds:
  better-sqlite3: true
  core-js: true
  esbuild: true
  msgpackr-extract: true
  puppeteer: true

catalog:
  zod: "^4.6.7"
  fastify: "^5.12.7"
  pino: "^10.4.0"
  drizzle-orm: "^0.45.4"
  react: "^19.3.1"
  react-dom: "^19.3.1"
  vite: "^8.3.4"
  "@tanstack/react-query": "^5.104.4"
  "@ts-rest/react-query": "3.52.1"
  react-router-dom: "^7.18.4"

# Supply-chain cooldown: package versions must be at least one day old before
# pnpm resolves them. `minimumReleaseAgeExclude` records the reviewed exceptions
# (fresh versions we intentionally need now); it is inert without this setting.
minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - nodemailer@9.0.1
  - lucide-react@1.22.0
  - pg-connection-string@2.14.0
  - pg-protocol@1.15.0
  - pg@8.22.0
  - "@types/node@26.0.1"
  - react-hook-form@7.80.0
  - fastify@5.11.2
  - "@oxc-transform-react/binding-android-arm-eabi@0.154.0"
  - "@oxc-transform-react/binding-android-arm64@0.154.0"
  - "@oxc-transform-react/binding-darwin-arm64@0.154.0"
  - "@oxc-transform-react/binding-darwin-x64@0.154.0"
  - "@oxc-transform-react/binding-freebsd-x64@0.154.0"
  - "@oxc-transform-react/binding-linux-arm-gnueabihf@0.154.0"
  - "@oxc-transform-react/binding-linux-arm-musleabihf@0.154.0"
  - "@oxc-transform-react/binding-linux-arm64-gnu@0.154.0"
  - "@oxc-transform-react/binding-linux-arm64-musl@0.154.0"
  - "@oxc-transform-react/binding-linux-ppc64-gnu@0.154.0"
  - "@oxc-transform-react/binding-linux-riscv64-gnu@0.154.0"
  - "@oxc-transform-react/binding-linux-riscv64-musl@0.154.0"
  - "@oxc-transform-react/binding-linux-s390x-gnu@0.154.0"
  - "@oxc-transform-react/binding-linux-x64-gnu@0.154.0"
  - "@oxc-transform-react/binding-linux-x64-musl@0.154.0"
  - "@oxc-transform-react/binding-openharmony-arm64@0.154.0"
  - "@oxc-transform-react/binding-win32-arm64-msvc@0.154.0"
  - "@oxc-transform-react/binding-win32-ia32-msvc@0.154.0"
  - "@oxc-transform-react/binding-win32-x64-msvc@0.154.0"
  - oxc-transform-react@0.154.0

peerDependencyRules:
  allowAny:
    - eslint

overrides:
  esbuild: "^0.25.0"
  # Supply-chain note: SheetJS removed `xlsx` from the npm registry, so the
  # frontend's client-side Excel export (dynamic `import("xlsx")`) must pull the
  # pinned 0.20.3 tarball from the official SheetJS CDN. The version is fixed
  # (no floating range) for reproducibility. If this becomes a blocker, replace
  # the frontend export with `exceljs` (already a backend dep) and drop this override.
  xlsx: "https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz"
  nanoid: "^3.3.18"
  # Security: bump transitive dep flagged by `pnpm audit`.
  # - uuid: exceljs pulls uuid@8 (deprecated + missing buffer bounds check); 11.x is CJS-compatible.
  uuid: "^11.1.1"
  # REVIEWED EXCEPTION — ts-deepmerge@6 (via @ts-rest/open-api > @anatine/zod-openapi)
  # carries CVE-2026-12644 (GHSA-87mf-gv2c-c62c): prototype-method-override DoS.
  # Deliberately NOT overridden to >=8:
  #   1. ts-deepmerge@8's CJS build no longer exports `.default()`, which
  #      @anatine/zod-openapi calls — the override breaks /api/openapi.json
  #      outright (guarded by a test in apps/backend/src/__tests__/app.health.test.ts).
  #   2. The advisory is NOT reachable here. The only consumer is
  #      `generateOpenApi(rootContract, {info})` in routes/common/openapi.ts, whose
  #      two arguments are static, developer-authored module constants — no
  #      attacker-controlled object ever reaches the merge. The route additionally
  #      404s in production unless MMS_EXPOSE_OPENAPI=true.
  # Revisit when @ts-rest/open-api ships a Zod-4-compatible generator (all current
  # releases, including prereleases, pin `zod: ^3.22.3` and @anatine/zod-openapi@1.x).
  # Security: lodash-es >=4.0.0 <=4.17.23 carries a code injection vuln in _.template().
  # Transitive path: mermaid → chevrotain → lodash-es. Pin to >=4.17.24 (patch-safe).
  lodash-es: ">=4.17.24"
  # Security: fast-uri <4.2.3 — host-confusion / scheme-spoofing advisories.
  # Transitive path: fastify → ajv / fast-json-stringify → fast-uri.
  fast-uri: "^4.2.3"
  # Security: ip-address <10.7.4 — quadratic-complexity advisory.
  # Transitive path: @fastify/rate-limit → ip-address.
  ip-address: ">=10.7.4"
  # Security: build-tooling only (not shipped runtime code).
  # Transitive paths: vite-plugin-pwa → workbox-build → @rollup/plugin-terser → serialize-javascript.
  serialize-javascript: ">=7.1.2"
  # REVIEWED EXCEPTION — deepmerge@4.3.1 (via vite-plugin-pwa > workbox-build >
  # @rollup/plugin-node-resolve) carries a low-severity advisory whose
  # `patched_versions` is `>=4.3.2`, but 4.3.2 was never published (4.3.1 is the
  # latest 4.x). Build-time only, no runtime path from request data. Revisit if a
  # patched release appears.
  # Security: Seroval GHSA-p6vx-979v-rg4c and GHSA-jp82-f5mq-hwhp.
  # Transitive path: @tanstack/react-query-devtools > @kobalte/core > solid-js > seroval.
  # GHSA typed-array code injection requires >=1.6.11 (also covers the earlier
  # prototype-pollution advisories).
  seroval: ">=1.6.11"
  # Security: source-map-js GHSA-68fv-2mgg-jv7q event-loop DoS via indexed section offsets.
  # Transitive path: @vitest/coverage-v8 > magicast / vite > postcss > source-map-js.
  source-map-js: ">=1.2.2"
  # Security: dompurify GHSA-cg2g-xh64-v4q7 and GHSA-mrv2-3pqr-j5jr.
  # Transitive path: apps/frontend > jspdf / mermaid > dompurify.
  dompurify: ">=3.4.17"
  # Security: happy-dom GHSA-834v-8h66-3h79 unsanitized import alias leads to host code execution.
  # Transitive path: @vitest/coverage-v8 > vitest > happy-dom.
  happy-dom: ">=21.0.4"
