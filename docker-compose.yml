# MMS full-stack compose (self-hosted / local ops profile).
#
# SECURITY CONTRACT (do not regress):
# - No secrets are committed to this file. All credentials are interpolated
#   from the environment (root .env or `docker compose --env-file`). Missing
#   required values fail fast with a clear error instead of shipping defaults.
# - Postgres/Redis are bound to 127.0.0.1 only. Backend/worker reach them over
#   the internal compose network; nothing listens on 0.0.0.0.
# - Redis requires a password (requirepass) and REDIS_URL carries it.
#
# Required before `docker compose up` (root .env or shell env):
#   POSTGRES_PASSWORD   (chosen by operator)
#   REDIS_PASSWORD      (generated, e.g. openssl rand -hex 24)
#   JWT_SECRET          (32+ chars, e.g. openssl rand -hex 32)
# See apps/backend/.env.example for the full application env contract.

services:
  postgres:
    image: postgres:16-alpine
    container_name: mms-postgres
    restart: unless-stopped
    # Connection budget (keep in sync with app PG_POOL_MAX):
    #   backend pool 20 + worker pool 20 + migration/bootstrap clients ≈ 45
    #   Postgres reserves a few for superuser_reserved_connections, so 200
    #   leaves comfortable headroom for admin sessions and future scale-out.
    #   If you raise PG_POOL_MAX or add backend replicas, raise this too.
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - wal_compression=on
      - -c
      - track_io_timing=on
      # Server-side counterpart to the app's 200ms transaction threshold, for
      # query-level investigation.
      - -c
      - log_min_duration_statement=500
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-mms}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - mms-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mms}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mms-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - mms-redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: mms-backend
    restart: unless-stopped
    ports:
      - "5002:5002"
    environment:
      NODE_ENV: production
      PORT: 5002
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mms}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?generate one with openssl rand -hex 32}
      # Per-process pool. backend + worker each open their own pool, so the
      # combined ceiling is 2 x PG_POOL_MAX against Postgres max_connections.
      PG_POOL_MAX: ${PG_POOL_MAX:-20}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5002/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: mms-worker
    command: ["node", "dist/worker/index.js"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mms}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?generate one with openssl rand -hex 32}
      PG_POOL_MAX: ${PG_POOL_MAX:-20}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mms-pgdata:
  mms-redisdata:
